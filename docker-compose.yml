services:
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    depends_on:
      - mongodb
    volumes:
      - .:/app
    command: uvicorn orchestrator.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  mongo_data:
