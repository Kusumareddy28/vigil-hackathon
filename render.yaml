services:
  - name: vigil-api
    type: web
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    autoDeployTrigger: commit
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8000"
      - key: START_SCHEDULER
        value: "0"
      - key: FRONTEND_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: vigil
      - key: GOOGLE_API_KEY
        sync: false
      - key: FIVETRAN_API_KEY
        sync: false
      - key: FIVETRAN_API_SECRET
        sync: false
      - key: FIVETRAN_ALLOW_WRITES
        value: "true"
